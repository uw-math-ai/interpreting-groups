[project]
name = "interpreting-groups"
version = "0.1.0"
description = "Mechanistic interpretability of continuous-group composition: representation selection, causal mechanism tests, and central-quotient experiments on compact Lie groups"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "matplotlib",
    "sympy",
    "scikit-learn",
    "plotly",
    "ipykernel>=7.2.0",
    "nbformat>=4.2.0",
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "experiments"]
